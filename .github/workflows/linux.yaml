name: CI for Linux
# https://github.com/google/mozc/blob/master/docs/build_mozc_for_linux.md

# Build on PRs and merges to custom. Tests run only on manual dispatch
# (run them locally: see docs/ci_custom.md).
on:
  push:
    branches:
      - custom
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - custom
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Manual run. Set "full" to also run the jobs that are skipped on merge.
  workflow_dispatch:
    inputs:
      full:
        description: 'Run all jobs (other architectures, tests)'
        type: boolean
        default: false

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build package --config release_build

      - name: Upload Artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mozc.zip
          path: src/bazel-bin/unix/mozc.zip
          if-no-files-found: warn

  test:
    # Skipped on merge to save CI minutes. Run manually with full=true.
    if: ${{ inputs.full }}
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel test
        working-directory: ./src
        run: |
          bazelisk test ... -c dbg --build_tests_only --test_output=errors --build_event_json_file=bep.jsonl

      - name: Collect failing test logs
        if: failure()
        working-directory: ./src
        run: |
          python3 build_tools/collect_test_logs.py --bep bep.jsonl --out "${GITHUB_WORKSPACE}/test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-${{ runner.os }}
          path: test_logs
          if-no-files-found: ignore
